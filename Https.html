<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Code Editor & Preview App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1e1e1e;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2d2d2d;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3c3c3c;
        }
        header h1 {
            font-size: 18px;
            color: #007acc;
        }
        .btn {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #005999;
        }
        .container {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
        }
        .editor-section, .preview-section {
            width: 50%;
            display: flex;
            flex-direction: column;
        }
        .editor-section {
            border-right: 2px solid #3c3c3c;
        }
        .section-title {
            background-color: #252526;
            padding: 8px 15px;
            font-size: 14px;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        textarea {
            width: 100%;
            flex: 1;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
        iframe {
            width: 100%;
            flex: 1;
            background-color: #ffffff;
            border: none;
        }
        /* Responsive Layout for Mobile */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .editor-section, .preview-section {
                width: 100%;
                height: 50%;
            }
            .editor-section {
                border-right: none;
                border-bottom: 2px solid #3c3c3c;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>HTML Code Editor</h1>
        <button class="btn" onclick="downloadHTML()">ডাউনলোড HTML</button>
    </header>
    <div class="container">
        <!-- Editor Left/Top -->
        <div class="editor-section">
            <div class="section-title">HTML / CSS / JS Code</div>
            <textarea id="code" placeholder="এখানে আপনার HTML কোড লিখুন..." oninput="updatePreview()"></textarea>
        </div>
        <!-- Preview Right/Bottom -->
        <div class="preview-section">
            <div class="section-title">Live Preview</div>
            <iframe id="preview"></iframe>
        </div>
    </div>
    <script>
        // ডিফল্ট ডেমো কোড
        const defaultCode = `<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        h1 { color: #007acc; }
        p { color: #555; }
    </style>
</head>
<body>
    <h1>স্বাগতম আপনার নতুন HTML অ্যাপে!</h1>
    <p>বামপাশের বক্সে কোড পরিবর্তন করুন এবং ডানপাশে সাথে সাথে লাইভ রেজাল্ট দেখুন।</p>
</body>
</html>`;
        const codeInput = document.getElementById('code');
        const previewIframe = document.getElementById('preview');
        // প্রথমবার ওপেন হলে ডেমো কোড দেখাবে
        codeInput.value = defaultCode;
        updatePreview();
        // লাইভ প্রিভিউ আপডেট করার ফাংশন
        function updatePreview() {
            const code = codeInput.value;
            const previewDoc = previewIframe.contentDocument || previewIframe.contentWindow.document;
            previewDoc.open();
            previewDoc.write(code);
            previewDoc.close();
        }
        // ফাইল ডাউনলোড করার ফাংশন
        function downloadHTML() {
            const code = codeInput.value;
            const blob = new Blob([code], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'index.html';
            link.click();
        }
    </script>
</body>
  </html>
